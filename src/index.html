<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <title>Sistema de Matriculas - ESEJURCE</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    /* Pantalla de carga inicial: se pinta antes de que descargue y arranque Angular y se retira (app.ts) cuando la
       primera ruta ya está lista. Solo usa CSS propio: no depende de ningún archivo de la aplicación. */
    body { margin: 0; background: #f8fafc; }
    #esejur-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      /* Blanco, como el fondo del logo: así no se ve una caja alrededor de la imagen. */
      background: #ffffff;
      transition: opacity 0.25s ease;
    }
    #esejur-splash.esejur-splash--oculto { opacity: 0; pointer-events: none; }
    #esejur-splash img { width: 168px; max-width: 52vw; height: auto; }
    .esejur-splash__pista {
      position: relative;
      width: 150px;
      height: 4px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .esejur-splash__pista::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 45%;
      border-radius: 999px;
      background: #0f766e;
      animation: esejur-splash-barra 1.1s ease-in-out infinite;
    }
    .esejur-splash__texto { margin: -12px 0 0; font: 500 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif; color: #64748b; }
    @keyframes esejur-splash-barra {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(340%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .esejur-splash__pista::after { animation-duration: 2.4s; }
    }
  </style>
</head>
