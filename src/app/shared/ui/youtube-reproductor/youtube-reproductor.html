<div class="yt">
  <div #pantalla class="yt__pantalla" (mousemove)="mostrarControles()" (touchstart)="mostrarControles()" (focusin)="mostrarControles()">
    <div class="yt__marco" [attr.aria-label]="titulo()">
      <div #destino></div>
    </div>

    <button type="button" class="yt__escudo" (click)="alternar()" [attr.aria-label]="reproduciendo() ? 'Pausar el video' : 'Reproducir el video'"></button>

    @if (listo() && !reproduciendo() && !terminado()) {
      <span class="yt__grande" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M8 5v14l11-7z" /></svg>
      </span>
    }

    @if (terminado()) {
      <div class="yt__fin" role="status">
        <p class="yt__fin-texto">Terminaste este video</p>
        <button type="button" class="yt__boton yt__boton--principal" (click)="repetir()">Ver de nuevo</button>
      </div>
    }

    @if (!listo() && !fallo()) {
      <p class="yt__cargando" role="status">Cargando video…</p>
    }

    <div class="yt__controles" [class.yt__controles--ocultos]="reproduciendo() && !actividad()" role="group" aria-label="Controles del video">
      <input type="range" class="yt__progreso" min="0" step="1" aria-label="Avance del video"
        [max]="duracion() || 1" [value]="actual()" [disabled]="!listo()"
        [style.--avance.%]="porcentaje()"
        (input)="arrastrar($any($event.target).value)" (change)="buscar($any($event.target).value)" />

      <div class="yt__fila">
        <button type="button" class="yt__boton yt__boton--icono" [disabled]="!listo()" (click)="retroceder()" aria-label="Retroceder 10 segundos" title="Retroceder 10 segundos">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg>
          <span class="yt__etiqueta-corta">10</span>
        </button>

        <button type="button" class="yt__boton yt__boton--principal" [disabled]="!listo()" (click)="alternar()" [attr.aria-pressed]="reproduciendo()">
          @if (reproduciendo()) {
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg>
            <span>Pausar</span>
          } @else {
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            <span>Reproducir</span>
          }
        </button>

        <button type="button" class="yt__boton yt__boton--icono" [disabled]="!listo()" (click)="adelantar()" aria-label="Adelantar 10 segundos" title="Adelantar 10 segundos">
          <span class="yt__etiqueta-corta">10</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7" /><path d="M21 4v5h-5" /></svg>
        </button>

        <span class="yt__tiempo" aria-live="off">{{ tiempo(actual()) }} / {{ tiempo(duracion()) }}</span>

        <div class="yt__volumen">
          <button type="button" class="yt__boton yt__boton--icono" [disabled]="!listo()" (click)="alternarSilencio()"
            [attr.aria-label]="silenciado() ? 'Activar sonido' : 'Silenciar'" [attr.title]="silenciado() ? 'Activar sonido' : 'Silenciar'">
            @if (silenciado()) {
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" /><path d="m22 9-6 6M16 9l6 6" /></svg>
            } @else {
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" /><path d="M15.5 8.5a5 5 0 0 1 0 7" /><path d="M18.5 5.5a9 9 0 0 1 0 13" /></svg>
            }
          </button>
          <input type="range" min="0" max="100" step="5" class="yt__volumen-barra" [disabled]="!listo()"
            [value]="silenciado() ? 0 : volumen()" (input)="cambiarVolumen($any($event.target).value)" aria-label="Volumen" />
        </div>

        <button type="button" class="yt__boton yt__boton--icono" [disabled]="!listo()" (click)="pantallaCompleta()" aria-label="Pantalla completa" title="Pantalla completa">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3" /></svg>
        </button>
      </div>
    </div>
  </div>

  @if (fallo()) {
    <p class="yt__error" role="alert">
      No pudimos cargar el video aquí.
      <a [href]="'https://www.youtube.com/watch?v=' + videoId()" target="_blank" rel="noopener">Verlo en YouTube</a>
    </p>
  }
</div>
