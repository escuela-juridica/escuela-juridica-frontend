<app-modal titulo="Cancelar sesión" (cerrar)="cerrado.emit()">
  <div class="alerta alerta--error modal-cancelar__alerta">
    <span class="alerta__icono">!</span>
    <div>
      <p class="alerta__titulo">Esta acción no se puede deshacer</p>
      <p class="alerta__texto">La sesión "{{ leccion.titulo }}" quedará cancelada de forma definitiva.</p>
    </div>
  </div>

  @if (error()) {
    <div class="alerta alerta--error modal-cancelar__alerta">
      <span class="alerta__icono">!</span>
      <div class="alerta__titulo">{{ error() }}</div>
      <button type="button" class="alerta__cerrar" (click)="error.set(null)" aria-label="Cerrar">✕</button>
    </div>
  }

  <div class="editor-campos editor-campos--1">
    <div>
      <label class="label"><span>Motivo</span><span class="nota-pill">Obligatorio</span></label>
      <textarea
        class="input"
        rows="3"
        placeholder="Explica por qué se cancela esta sesión"
        [value]="motivo()"
        (input)="motivo.set($any($event.target).value)"
      ></textarea>
    </div>
  </div>

  <div class="editor-form__acciones">
    <button type="button" class="btn btn--secundario" (click)="cerrado.emit()">Volver</button>
    <button type="button" class="btn btn--peligro" [disabled]="guardando()" (click)="guardar()">
      {{ guardando() ? 'Cancelando…' : 'Cancelar sesión' }}
    </button>
  </div>
</app-modal>
